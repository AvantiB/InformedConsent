# Local Phase 1 model config.
# Do not commit API keys, bearer tokens, private endpoints, local model paths, or cluster paths.

# model_key is the script/output key, for example medgemma, qwen235b, llama4_scout, mayo_gpt55, or mayo_gpt55_schema.
# model is the exact model name sent to the API for OpenAI-compatible local servers.
# For vLLM, model must exactly match --served-model-name.

defaults:
  api_type: chat_completions
  temperature: 0
  max_tokens: 4096
  timeout_seconds: 120
  max_retries: 3
  retry_sleep_seconds: 5

models:
  medgemma:
    provider: openai_compatible
    model: medgemma
    base_url: http://127.0.0.1:8000/v1
    api_key_env: VLLM_API_KEY

  qwen235b:
    provider: openai_compatible
    model: qwen235b
    base_url: http://127.0.0.1:8000/v1
    api_key_env: VLLM_API_KEY

  llama4_scout:
    provider: openai_compatible
    # Change this locally if your vLLM --served-model-name differs.
    model: meta-llama/Llama-4-Scout-17B-16E-Instruct
    base_url: http://127.0.0.1:8000/v1
    api_key_env: VLLM_API_KEY

  mayo_gpt55:
    provider: mayo_apigee_azure_openai
    model: gpt-5.5
    deployment: gpt-5.5
    api_version: "2024-10-21"
    apigee_url: https://mcc.apix.mayo.edu
    oauth_token_url: https://mcc.apix.mayo.edu/oauth/token
    oauth_client_id_env: APIGEE_CLIENT_ID
    oauth_client_secret_env: APIGEE_CLIENT_SECRET
    # Optional fallback if you already have a refreshed bearer token.
    api_key_file_env: APIGEE_TOKEN_FILE
    api_key_env: APIGEE_TOKEN
    omit_temperature: true
    top_p: 1
    max_tokens: 8192
    timeout_seconds: 120
    max_retries: 6
    retry_sleep_seconds: 10

  mayo_gpt55_schema:
    provider: mayo_apigee_azure_openai
    model: gpt-5.5
    deployment: gpt-5.5
    api_version: "2024-10-21"
    apigee_url: https://mcc.apix.mayo.edu
    oauth_token_url: https://mcc.apix.mayo.edu/oauth/token
    oauth_client_id_env: APIGEE_CLIENT_ID
    oauth_client_secret_env: APIGEE_CLIENT_SECRET
    api_key_file_env: APIGEE_TOKEN_FILE
    api_key_env: APIGEE_TOKEN
    omit_temperature: true
    top_p: 1
    reasoning_effort: low
    max_tokens: 12000
    timeout_seconds: 300
    max_retries: 6
    retry_sleep_seconds: 10
